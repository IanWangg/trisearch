[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trisearch"
version = "0.1.0"
description = "TriSearch: Learning to Optimize Triangulations via Bistellar Flips"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch>=2.0",
    "torch_geometric>=2.3",
    "datasets",
    "tqdm",
]

[project.optional-dependencies]
wandb = ["wandb"]
dev = ["pytest"]

[project.scripts]
trisearch-train = "trisearch.train:main"
trisearch-eval = "trisearch.evaluate:main"
trisearch-summarize = "trisearch.summarize:main"
trisearch-datagen = "trisearch.datagen.__main__:main"

[tool.setuptools.packages.find]
include = ["trisearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
